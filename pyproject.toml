[project]
name = "detect-football-talents"
version = "1.0.0"
description = "Plateforme de détection de talents football basée sur la performance avancée"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    # Scraping
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "soccerdata>=1.8.0",
    "cloudscraper>=1.2.71",
    "lxml>=5.0.0",
    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    # Dashboard
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    # Utils
    "python-dotenv>=1.0.0",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.25.0",
    "apache-airflow>=3.1.7",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

airflow = [
    "apache-airflow>=2.8.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
